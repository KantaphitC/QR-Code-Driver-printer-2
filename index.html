<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Driver Printer By IT-Knex</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: #ffffff;
            padding: 35px;
            width: 320px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease-in-out;
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        img {
            width: 200px;
            height: auto;
            margin: 15px 0 25px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        a {
            text-decoration: none;
        }

        button {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,123,255,0.4);
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Driver Printer</h1>
        <p>สแกน QR Code หรือกดปุ่มด้านล่างเพื่อดาวน์โหลดไดรเวอร์</p>

        <img src="https://capitalist-olive-czu6sa2387.edgeone.app/Toshiba%20Printer%20.png" alt="QR Code">

        <a href="https://www.mediafire.com/file/gma7vc15bhjkohd/Toshiba+Printer+script.zip/file" target="_blank">
            <button>⬇ ดาวน์โหลดไดรเวอร์</button>
        </a>

        <div class="footer">
            © 2026 IT-Knex
        </div>
    </div>

</body>
</html>
