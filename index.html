<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Driver Center By SudLor</title>

<style>
:root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #111827;
    --primary: #2563eb;
}

body.dark {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e5e7eb;
    --primary: #38bdf8;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: .3s;
}

/* Navbar */
.navbar {
    background: var(--card);
    padding: 12px 25px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

.navbar h2 {
    margin: 0;
    white-space: nowrap;
}

/* Menu */
.menu {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.menu button {
    background: transparent;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
}

.menu button.active,
.menu button:hover {
    background: var(--primary);
    color: white;
}

/* Controls */
.controls {
    margin-left: auto;
    display: flex;
    gap: 10px;
}

.search {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.toggle-btn {
    cursor: pointer;
    padding: 8px 14px;
    border-radius: 6px;
    background: var(--primary);
    color: white;
    border: none;
}

/* Grid */
.container {
    padding: 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 25px;
}

/* Card */
.card {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,.15);
    opacity: 0;
    transform: translateY(30px);
    transition: .4s ease;
}

.card.show {
    opacity: 1;
    transform: translateY(0);
}

.card:hover {
    transform: translateY(-10px) scale(1.03);
}

.card img {
    width: 100%;
    border-radius: 8px;
    margin-bottom: 15px;
}

.card h3 {
    margin: 8px 0;
}

.count {
    font-size: 14px;
    opacity: .8;
}

.card button {
    margin-top: 10px;
    padding: 10px 18px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* Footer */
footer {
    background: var(--card);
    padding: 20px;
    text-align: center;
    box-shadow: 0 -2px 8px rgba(0,0,0,.1);
}
</style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <h2>All for GU</h2>

    <div class="menu">
        <button class="active" onclick="filterCategory('all', this)">All</button>
        <button onclick="filterCategory('printer', this)">Printer</button>
        <button onclick="filterCategory('vga', this)">VGA</button>
        <button onclick="filterCategory('program', this)">Program</button>
        <button onclick="filterCategory('script', this)">Script</button>
    </div>

    <div class="controls">
        <input class="search" type="text" placeholder="ค้นหา..." onkeyup="searchDriver(this.value)">
        <button class="toggle-btn" onclick="toggleTheme()">🌙</button>
    </div>
</div>

<!-- Content -->
<div class="container">
    <div class="card" data-name="hp printer" data-category="printer">
        <img src="https://functional-lime-trl55shu4r.edgeone.app/Screenshot%202026-02-02%20173343.png">
        <h3>Toshiba Printer Driver FL.3</h3>
        <div class="count">ดาวน์โหลด: <span>0</span></div>
        <button onclick="download(this)">ดาวน์โหลด</button>
    </div>
</div>

<!-- Footer -->
<footer>
    © 2026 น้องกันสุดหล่อสุดเท่ | เย่เย่เย่เย่
</footer>

<script>
// Theme
function toggleTheme() {
    document.body.classList.toggle("dark");
}

// Download count
function download(btn) {
    const span = btn.previousElementSibling.querySelector("span");
    span.textContent = parseInt(span.textContent) + 1;
}

// Search
function searchDriver(text) {
    text = text.toLowerCase();
    document.querySelectorAll(".card").forEach(card => {
        card.style.display = card.dataset.name.includes(text) ? "block" : "none";
    });
}

// Category filter
function filterCategory(category, el) {
    document.querySelectorAll(".menu button").forEach(b => b.classList.remove("active"));
    el.classList.add("active");

    document.querySelectorAll(".card").forEach(card => {
        if (category === "all" || card.dataset.category === category) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}

// Scroll animation
const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add("show");
        }
    });
});

document.querySelectorAll(".card").forEach(card => observer.observe(card));
</script>
<script>
// ====== DOWNLOAD LINK MAP (เพิ่มอย่างเดียว ไม่แก้โค้ดเดิม) ======
const downloadLinks = {
    "Toshiba Printer Driver FL.3": "https://www.mediafire.com/file/gma7vc15bhjkohd/Toshiba+Printer+script.zip/file"
};

// Override download function (เขียนทับของเดิมโดยไม่แก้)
function download(btn) {
    const card = btn.closest(".card");
    const title = card.querySelector("h3").innerText.trim();
    const span = card.querySelector(".count span");

    // นับจำนวนดาวน์โหลด
    span.textContent = parseInt(span.textContent) + 1;

    // เปิดลิงก์ดาวน์โหลด
    if (downloadLinks[title]) {
        window.open(downloadLinks[title], "_blank");
    } else {
        alert("ยังไม่ได้กำหนดลิงก์ดาวน์โหลด");
    }
}
</script>
</body>
</html>
